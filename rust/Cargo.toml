# The Rust `howl`, beside the TypeScript until the cut (docs/decisions.md).
[package]
name = "howl"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "howl"
path = "src/main.rs"

[dependencies]
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
ryu-js = "=1.0.4"
sha2 = "=0.11.1"
ed25519-dalek = "=3.0.0"
# The patterns a team writes in .howl/howl.yml, matched as JavaScript's RegExp with the u flag matches them (#141).
regress = { version = "=0.12.0", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
# A panic in `howl hook` is caught, so that the hook never disturbs a session (#141): never "abort".
panic = "unwind"
