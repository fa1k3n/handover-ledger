# How Watchbill is set up in this repository. Written by `wb init`.
# `watchbill` is the version of the package the repository is set up for.
watchbill: 0.10.0
revision: d31965c098b379f55adc029b81ec79555881c79cb141bb196a01faa003707795
project: handover-ledger
git_server: github
repository: fa1k3n/handover-ledger
tracker: github
requirements: none
ci: github-actions
confidentiality: public
classed: []
needs: 'case {file} in *.ts) if [ -f {file} ]; then npx --no-install esbuild {file} --bundle --platform=node --packages=external --metafile=/dev/stdout --outfile=/dev/null --log-level=error --format=esm | jq -r ''.inputs | keys[]''; fi ;; esac'
issue_comment: 'gh issue comment {issue} --repo fa1k3n/handover-ledger --body-file -'
issue_comments: 'gh api repos/fa1k3n/handover-ledger/issues/{issue}/comments --paginate --jq ''.[].body | split("\n")[0]'''
change_comment: 'gh pr comment {change} --repo fa1k3n/handover-ledger --body-file -'
change_comments: 'gh api repos/fa1k3n/handover-ledger/issues/{change}/comments --paginate --jq ''.[].body | split("\n")[0]'''
change_of_branch: 'gh pr list --repo fa1k3n/handover-ledger --head {branch} --state open --json number --jq ''.[].number'''
issue_address: 'gh issue view {issue} --repo fa1k3n/handover-ledger; gh issue view {issue} --repo fa1k3n/handover-ledger --comments'
change_address: 'gh pr view {change} --repo fa1k3n/handover-ledger; gh pr view {change} --repo fa1k3n/handover-ledger --comments'
branch: 'issue-{issue}'
build_files: ['.github/workflows', 'package.json', 'package-lock.json', 'tsconfig.json', 'tsconfig.build.json', 'scripts']
change_checks: 'gh pr checks {change} --repo fa1k3n/handover-ledger --json bucket --jq ''[.[].bucket] | if length == 0 then "pending" elif any(. == "fail" or . == "cancel") then "red" elif all(. == "pass" or . == "skipping") then "green" else "pending" end'''
open_issues: 'gh issue list --repo fa1k3n/handover-ledger --state open --limit 1000 --json number,title --jq ''.[] | "\(.number)\t\(.title | gsub("[\n\r]"; " "))"'''
issue_comment_bodies: 'gh api repos/fa1k3n/handover-ledger/issues/{issue}/comments --paginate --jq ''.[] | .body + "\u0000"'''
change_comment_bodies: 'gh api repos/fa1k3n/handover-ledger/issues/{change}/comments --paginate --jq ''.[] | .body + "\u0000"'''
draft_change: 'gh pr create --repo fa1k3n/handover-ledger --head {branch} --draft --fill-verbose'
