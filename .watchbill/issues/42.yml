questions:
  - '`keyFigures` counts the reviews of a merged change up to its merge. With `rounds`, does it count the rounds of all the change''s observed reviews in the ledger, reviews after the merge included, or only the rounds before the merge?'
  - 'test/overview.test.ts, "#52 R52.1: on a ledger of people only, there is no unattributed figure, and the other figures are as before", asserts `reviewRoundsMean` 2 from a `review.commented` and a `review.approved` on one head of change 7. Under the new rule it is 1. The issue names only "the test of `reviewRoundsMean`". May this test change, and is it to be listed under existing_tests_changed?'
  - 'src/dashboard/texts.ts: the figure is already titled "Review rounds per change", and its note says "mean of N merged changes, last D days". What is the note under the figure to say after the change?'
  - 'README.md, "where the overview is described": which text changes, and to what? The nearest is the paragraph "A review is a review", which says "Review rounds, handovers and the overview''s figures count reviews only".'
  - 'Does the type `Round` move to src/read/rounds.ts with `rounds`, or stay in src/read/show.ts? The page imports rounds.ts, which must stay without Node.'
  - '"`show` calls it once": is this to be shown by a test (for example one that reads src/read/show.ts), or left to the review?'
  - 'The new tests are placed in test/rounds.test.ts here, beside test/rounds-text.test.ts. Is that the file, or do they go in test/overview.test.ts and test/show.test.ts?'
