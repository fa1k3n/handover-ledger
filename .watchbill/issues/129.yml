issue: '129'
from: 396c41766393c074ef3203a7d411d819bc8a958b75bf47b059348e93d428a350
requirements:
  - id: '129.1'
    text: 'A session with both HOWL_HARNESS (the name of the harness) and HOWL_HARNESS_REVISION (a text the harness chooses for its revision) set in its environment: the hook puts both on every event of the session, marked as claimed, in one field `harness` with two parts, `name` and `revision`.'
    source: 'What to build, 1: "The hook puts both on every event of the session as a claim."; Tests first, 1; the answer to 129.q1 (choice 1).'
  - id: '129.2'
    text: 'With only one of HOWL_HARNESS and HOWL_HARNESS_REVISION set, no event of the session holds either.'
    source: 'What to build, 1: "With one of the two missing, neither is recorded."; Tests first, 2.'
  - id: '129.3'
    text: 'The event schema gets the field `harness`, with its two parts `name` and `revision` as plain text of at most 256 characters each, holding no control character (U+0000 to U+001F and U+007F, the line breaks and the tab among them). A value over 256 characters, or one with a line break or another control character, is refused as the schema refuses any other, and nothing is written.'
    source: 'What to build, 3: "The schema gets the field, with both parts as plain text of a bounded length."; Tests first, 3; the answers to 129.q1, 129.q2 and 129.q3 (choice 1 each).'
  - id: '129.4'
    text: 'The TypeScript types are generated from the schema with the new field (src/ledger/event.gen.ts), never edited by hand.'
    source: 'What to build, 3; CLAUDE.md: "The TypeScript types are generated from it (npm run gen) and never edited by hand."'
    guard: 'the generated types are current for both schemas'
  - id: '129.5'
    text: 'The hook line that is only `curl` carries HOWL_HARNESS and HOWL_HARNESS_REVISION as the headers X-Howl-Harness and X-Howl-Harness-Revision, as it carries the role and the role prompt, and a hook sent to /api/hook with them gives the same event as `howl hook` gives from the environment.'
    source: 'What to build, 2: "The hook line that is only curl carries them as headers, as it carries the role and the role prompt."; Tests first, 4: "The header form gives the same event as the environment form."; the answer to 129.tester q2 (choice 1).'
  - id: '129.6'
    text: 'Where the session has a key, the claim is signed with the rest of the event: with a key, an event whose harness or revision is changed after signing fails `howl verify`.'
    source: 'What to build, 3: "Where the session has a key, the claim is signed with the rest of the event."; Tests first, 5.'
    guard: '#23: a signed claim changed before it reached the ledger fails, naming the line'
  - id: '129.7'
    text: '`howl show` of a change or a task names the harness and its revision beside each session''s role, as `harness <name> <revision>` after `role <role>` on the session''s line; of a change with a build and a review under one revision it names it once per session.'
    source: 'What to build, 4: "howl show of a change or a task names the harness and its revision beside each session''s role."; Tests first, 6; the answer to 129.q7 (choice 1).'
  - id: '129.8'
    text: 'Where the sessions of one change ran under different revisions, `howl show` names both and says that they differ, in a line of its own under Sessions: `the sessions of change <change> ran under different revisions: <name> <revision>, <name> <revision>`. Two sessions differ when their harness name or revision differ; a session with no harness is left out of the comparison.'
    source: 'What to build, 4: "Where the sessions of one change ran under different revisions, it says so in a line of its own."; Tests first, 6; the answers to 129.q5 and 129.q7 (choice 1 each).'
  - id: '129.9'
    text: 'A session with no harness named is shown by `howl show` as before, and its events are unchanged byte for byte.'
    source: 'Tests first, 7.'
  - id: '129.10'
    text: '`howl watch` can filter on the name of the harness and on the revision, also by the pairs `harness=<name>` and `revision=<revision>`, a value ending in `*` matching what starts with the rest, as for the other pairs.'
    source: 'What to build, 5: "howl watch can filter on the name and on the revision."; the answer to 129.q8 (choice 1).'
  - id: '129.11'
    text: 'The README, where it describes recording a coding agent, describes HOWL_HARNESS and HOWL_HARNESS_REVISION, names both, and shows the hook line with their headers as howl gives it.'
    source: 'What to build, 6: "The README where it describes recording a coding agent"; What to build, 2; the answer to 129.tester q3 (choice 1).'
    guard: 'the README shows the hook line as howl gives it'
  - id: '129.12'
    text: 'docs/architecture.md, where it lists what stays a claim, names the harness and its revision, by the field''s name `harness`.'
    source: 'What to build, 6: "docs/architecture.md where it lists what stays a claim"; the answer to 129.tester q3 (choice 1).'
  - id: '129.13'
    text: 'A ledger written before this step still verifies.'
    source: 'Tests first, 8.'
    guard: 'howl verify passes an untouched ledger, and ends with 0 and the count'
  - id: '129.14'
    text: 'howl only records the claim: it checks the revision against nothing, names no one harness, and no rule reads the revision. No test shows all of this: the review reads for it.'
    source: 'Why: "howl only records the claim. Whether the revision holds is for the harness to check"; Not in this step, 1 to 3.'
  - id: '129.15'
    text: 'HOWL_HARNESS and HOWL_HARNESS_REVISION are read as the other names of the session (HOWL_ROLE, HOWL_TASK): each value is trimmed, and a value that is empty or only blanks counts as missing, so that neither is recorded.'
    source: 'What to build, 1: "With one of the two missing, neither is recorded."; the answer to 129.q4 (choice 1).'
  - id: '129.16'
    text: '`howl show` of a task with several changes gives the line that the revisions differ for each change of the task whose sessions differ, naming that change.'
    source: 'What to build, 4: "Where the sessions of one change ran under different revisions"; the answer to 129.q6 (choice 1).'
  - id: '129.17'
    text: 'The help of `howl watch` and the README name the pairs `harness=<name>` and `revision=<revision>`.'
    source: 'What to build, 5 and 6; the answer to 129.q8 (choice 1): "The help and the README name them."'
  - id: '129.18'
    text: 'The table of fields in docs/architecture.md gets a row for `harness`, and its row for `rules`, which "waits for the rules", says what became of it. No test shows this: the review reads for it.'
    source: 'What to build, 6; Why: "The field rules left the schema on 2026-11-14 ... to come back with the step that does"; the answer to 129.q9 (choice 1).'
interface: |
  The names in the session's environment, as the issue gives them:
    HOWL_HARNESS            the name of the harness
    HOWL_HARNESS_REVISION   a text the harness chooses for its revision
  Each is trimmed; empty or only blanks is missing. With one missing, neither is recorded.

  The event field, in schema/event.v0.schema.json, and on LedgerEvent in the generated src/ledger/event.gen.ts:
    harness?: { name: string; revision: string }
    each part 1 to 256 characters, no character U+0000 to U+001F or U+007F.
  The field `rules` stays out of the schema.

  src/hook/hook.ts, as it is:
    runHook(stdin: string, env: Record<string, string | undefined>, cwd: string): Promise<void>
    eventOfHook(hook: Record<string, unknown>, env: Record<string, string | undefined>, dir: string, adapter: string)
      : { project: Project; event: LedgerEvent } | null

  src/hook/line.ts, as it is, with two entries added to HOOK_HEADERS:
    HOOK_HEADERS: { HOWL_ACTOR: "X-Howl-Actor", HOWL_TASK: "X-Howl-Task", HOWL_CHANGE: "X-Howl-Change",
                    HOWL_ROLE: "X-Howl-Role", HOWL_ROLE_PROMPT: "X-Howl-Role-Prompt", ...,
                    HOWL_HARNESS: "X-Howl-Harness", HOWL_HARNESS_REVISION: "X-Howl-Harness-Revision" }
    curlHookLine(options: { url: string; tokenFile: string }): string

  src/ledger/schema.ts, as it is:
    eventFaults(value: unknown): string[]

  src/ledger/ledger.ts, as it is:
    openLedger(path, { project }) -> writer with append(event) and close(); type LedgerEvent

  src/read/show.ts, as it is:
    show(all: LedgerEvent[], asked: Asked, activityFrom: string | null, options?: { matched?: boolean }): Shown | null
    render(shown: Shown, options?: { utc?: boolean }): string
    parseAsked(text: string): Asked
    interface Session { session: string; actor?: Actor; role?: string; ... }  gets the session's harness and revision
  The session's line, after `role <role>`:  harness <name> <revision>
  A line under Sessions, one for each change whose sessions differ:
    the sessions of change <change> ran under different revisions: <name> <revision>, <name> <revision>

  src/read/filter.ts, as it is:
    readFilters(texts: string[]): Filters   (Filters.test(event): boolean; Filters.failed(): Failed | null)
    two pairs added: harness=<name> and revision=<revision>, a value ending in `*` matching a start.

  As a process: `howl hook` reads the hook's JSON on standard input, takes HOWL_ACTOR, HOWL_TASK, HOWL_CHANGE,
  HOWL_ROLE, HOWL_ROLE_PROMPT, HOWL_KEY, HOWL_HOME and now HOWL_HARNESS and HOWL_HARNESS_REVISION from the environment,
  prints nothing, ends with 0, and leaves one event in the inbox. `howl ingest` takes the inbox in and moves a
  refused event to rejected/. `howl verify` checks the ledger and the signatures. `howl show <task or change>`
  prints the timeline, `--json` gives Shown. `howl watch --filter <text> --no-follow` prints the matching events.
  `howl --help` prints the help of `howl watch`. `howl up`'s POST /api/hook takes the hook's JSON with the names
  as headers.

  Test helpers, as they are: test/helpers.ts (event, folder, git, howl, inboxEvents, inboxFiles, lines, rawLines,
  ledgerWith, PROJECT, workspace, type Workspace), test/up-helpers.ts (up, until, send, claim, type Up),
  test/local-host.ts (LocalHost), test/story.ts (writeStory, m, SHA).
