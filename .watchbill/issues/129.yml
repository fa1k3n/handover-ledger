issue: '129'
from: 396c41766393c074ef3203a7d411d819bc8a958b75bf47b059348e93d428a350
requirements:
  - id: '129.1'
    text: 'A session with both HOWL_HARNESS (the name of the harness) and HOWL_HARNESS_REVISION (a text the harness chooses for its revision) set in its environment: the hook puts both on every event of the session, marked as claimed.'
    source: 'What to build, 1: "The hook puts both on every event of the session as a claim."; Tests first, 1: "every event of it holds the harness and the revision, marked as claimed".'
  - id: '129.2'
    text: 'With only one of HOWL_HARNESS and HOWL_HARNESS_REVISION set, no event of the session holds either.'
    source: 'What to build, 1: "With one of the two missing, neither is recorded."; Tests first, 2.'
  - id: '129.3'
    text: 'The event schema gets the field, with both parts as plain text of a bounded length. A value over the bounded length, or one with a line break, is refused as the schema refuses any other, and nothing is written.'
    source: 'What to build, 3: "The schema gets the field, with both parts as plain text of a bounded length."; Tests first, 3. The name, the bound and what plain text excludes wait for 129.q1, 129.q2 and 129.q3.'
  - id: '129.4'
    text: 'The TypeScript types are generated from the schema with the new field (src/ledger/event.gen.ts), never edited by hand.'
    source: 'What to build, 3; CLAUDE.md: "The TypeScript types are generated from it (npm run gen) and never edited by hand."'
    guard: 'the generated types are current for both schemas'
  - id: '129.5'
    text: 'The hook line that is only `curl` carries HOWL_HARNESS and HOWL_HARNESS_REVISION as headers, as it carries the role and the role prompt, and a hook sent to /api/hook with them gives the same event as `howl hook` gives from the environment.'
    source: 'What to build, 2: "The hook line that is only curl carries them as headers, as it carries the role and the role prompt."; Tests first, 4: "The header form gives the same event as the environment form."'
  - id: '129.6'
    text: 'Where the session has a key, the claim is signed with the rest of the event: with a key, an event whose harness or revision is changed after signing fails `howl verify`.'
    source: 'What to build, 3: "Where the session has a key, the claim is signed with the rest of the event."; Tests first, 5.'
    guard: '#23: a signed claim changed before it reached the ledger fails, naming the line'
  - id: '129.7'
    text: '`howl show` of a change or a task names the harness and its revision beside each session''s role; of a change with a build and a review under one revision it names it once per session.'
    source: 'What to build, 4: "howl show of a change or a task names the harness and its revision beside each session''s role."; Tests first, 6. The words wait for 129.q7.'
  - id: '129.8'
    text: 'Where the sessions of one change ran under different revisions, `howl show` names both and says that they differ, in a line of its own.'
    source: 'What to build, 4: "Where the sessions of one change ran under different revisions, it says so in a line of its own."; Tests first, 6. What counts as different, and the view of a task, wait for 129.q5 and 129.q6.'
  - id: '129.9'
    text: 'A session with no harness named is shown by `howl show` as before, and its events are unchanged byte for byte.'
    source: 'Tests first, 7.'
  - id: '129.10'
    text: '`howl watch` can filter on the name of the harness and on the revision.'
    source: 'What to build, 5. How, by pairs or by the expression alone, waits for 129.q8.'
  - id: '129.11'
    text: 'The README, where it describes recording a coding agent, describes HOWL_HARNESS and HOWL_HARNESS_REVISION, and shows the hook line with their headers as howl gives it.'
    source: 'What to build, 6: "The README where it describes recording a coding agent"; What to build, 2.'
    guard: 'the README shows the hook line as howl gives it'
  - id: '129.12'
    text: 'docs/architecture.md, where it lists what stays a claim, names the harness and its revision. No test shows this: the review reads for it.'
    source: 'What to build, 6: "docs/architecture.md where it lists what stays a claim". Whether the table of fields changes too waits for 129.q9.'
  - id: '129.13'
    text: 'A ledger written before this step still verifies.'
    source: 'Tests first, 8.'
    guard: 'howl verify passes an untouched ledger, and ends with 0 and the count'
  - id: '129.14'
    text: 'howl only records the claim: it checks the revision against nothing, names no one harness, and no rule reads the revision. No test shows all of this: the review reads for it.'
    source: 'Why: "howl only records the claim. Whether the revision holds is for the harness to check"; Not in this step, 1 to 3.'
interface: |
  The names in the session's environment, as the issue gives them:
    HOWL_HARNESS            the name of the harness
    HOWL_HARNESS_REVISION   a text the harness chooses for its revision

  The event field: its name and shape wait for 129.q1, its bound for 129.q2, what it excludes for 129.q3.
  It goes in schema/event.v0.schema.json, and the generated src/ledger/event.gen.ts gives it on LedgerEvent.

  src/hook/hook.ts, as it is:
    runHook(stdin: string, env: Record<string, string | undefined>, cwd: string): Promise<void>
    eventOfHook(hook: Record<string, unknown>, env: Record<string, string | undefined>, dir: string, adapter: string)
      : { project: Project; event: LedgerEvent } | null

  src/hook/line.ts, as it is, with two entries added to HOOK_HEADERS:
    HOOK_HEADERS: { HOWL_ACTOR: "X-Howl-Actor", HOWL_TASK: "X-Howl-Task", HOWL_CHANGE: "X-Howl-Change",
                    HOWL_ROLE: "X-Howl-Role", HOWL_ROLE_PROMPT: "X-Howl-Role-Prompt", ... }
    curlHookLine(options: { url: string; tokenFile: string }): string
    The header names of the two new entries follow the others (X-Howl-Harness, X-Howl-Harness-Revision).

  src/ledger/schema.ts, as it is:
    eventFaults(value: unknown): string[]

  src/ledger/ledger.ts, as it is:
    openLedger(path, { project }) -> writer with append(event) and close(); type LedgerEvent

  src/read/show.ts, as it is:
    show(all: LedgerEvent[], asked: Asked, activityFrom: string | null, options?: { matched?: boolean }): Shown | null
    render(shown: Shown, options?: { utc?: boolean }): string
    parseAsked(text: string): Asked
    interface Session { session: string; actor?: Actor; role?: string; ... }  gets the session's harness and revision

  src/read/filter.ts, as it is:
    readFilters(texts: string[]): Filters   (Filters.test(event): boolean; Filters.failed(): Failed | null)

  As a process: `howl hook` reads the hook's JSON on standard input, takes HOWL_ACTOR, HOWL_TASK, HOWL_CHANGE,
  HOWL_ROLE, HOWL_ROLE_PROMPT, HOWL_KEY, HOWL_HOME and now HOWL_HARNESS and HOWL_HARNESS_REVISION from the environment,
  prints nothing, ends with 0, and leaves one event in the inbox. `howl ingest` takes the inbox in and moves a
  refused event to rejected/. `howl verify` checks the ledger and the signatures. `howl show <task or change>`
  prints the timeline, `--json` gives Shown. `howl watch --filter <text> --no-follow` prints the matching events.
  `howl up`'s POST /api/hook takes the hook's JSON with the names as headers.

  Test helpers, as they are: test/helpers.ts (event, folder, git, howl, inboxEvents, inboxFiles, lines, rawLines,
  ledgerWith, PROJECT, workspace, type Workspace), test/up-helpers.ts (up, until, send, claim, type Up),
  test/local-host.ts (LocalHost), test/story.ts (writeStory, m, SHA).
