questions:
  - '129.q1: The field''s name and shape: "The schema gets the field, with both parts", while Why says the field `rules` left the schema "to come back with the step that does. This is that step." 1. one field `harness` with `name` and `revision`; 2. the field `rules` comes back with `harness` and `revision`, which changes the two tests of removed fields in test/schema-used.test.ts; 3. two fields at the top, `harness` and `harness_revision`. Suggested: 1.'
  - '129.q2: The bound of "plain text of a bounded length": 1. at most 256 characters for each part; 2. at most 128 for the name and 512 for the revision. Suggested: 1.'
  - '129.q3: What "plain text" excludes: 1. every control character (U+0000 to U+001F and U+007F), line breaks and tabs among them; 2. only the line breaks (LF and CR). Suggested: 1.'
  - '129.q4: Whether a value that is empty or only blanks counts as "missing", and whether a value is trimmed: 1. as the other names of the session: trimmed, and a blank value is missing; 2. taken as it stands, and only an unset or empty value is missing. Suggested: 1.'
  - '129.q5: What counts as "different revisions" for `howl show`: 1. two sessions whose name and revision differ, sessions with no harness left out; 2. the same, and a session with no harness among sessions with one counts as a difference too; 3. only the revision, whatever the name. Suggested: 1.'
  - '129.q6: In `howl show` of a task with several changes, where the line that the revisions differ stands: 1. a line for each change of the task whose sessions differ, naming that change; 2. one line for the task when its sessions differ across all its changes. Suggested: 1.'
  - '129.q7: The words of `howl show`: 1. `harness <name> <revision>` after `role <role>` on the session''s line, and a line under Sessions `the sessions of change <change> ran under different revisions: <name> <revision>, <name> <revision>`; 2. other words, which the answer gives. Suggested: 1.'
  - '129.q8: What "howl watch can filter on the name and on the revision" asks, since the expression form filters on any field already: 1. pairs too, `harness=<name>` and `revision=<revision>`, with `*` at the end as for the other pairs, and the help and the README name them; 2. nothing new in the code: a test shows the expression form, and the README gives an example. Suggested: 1.'
  - '129.q9: Whether docs/architecture.md changes only "where it lists what stays a claim", or also its table of fields, where `rules` "waits for the rules": 1. the table too: a row for the new field, and the `rules` row says what became of it; 2. only the list of what stays a claim. Suggested: 1.'
