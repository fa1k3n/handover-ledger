existing_tests_changed: ['test/who-acted-read.test.ts: the summary starts at the first giving: a task given to one agent, its change merged, then taken back and given to another: it compares a duration of `howl show` as text (`3m`), which takes the one form (`3 min`)', 'test/who-acted-read.test.ts: a task given only after its change had ended is measured from the first sign of work, with the label of that, not as 0s from a hand-over: it compares a duration of `howl show` as text (`30m`), which takes the one form (`30 min`)']
questions:
  - '43.q1: Where hours end and days begin: `howl status` writes whole days from 24 h (`3 d`), the overview writes days with one decimal from 48 h (`2.5 d`).'
  - '43.q2: How a duration below an hour is rounded, and whether seconds are shown above a minute: `howl show` writes `1m 30s`, the others whole minutes, rounded down in `howl status` and to the nearest in the overview.'
  - '43.q3: Whether `since(time, now)` in `state.ts` goes, its callers calling `duration` with the span, or stays as a call of `duration`; and what a span below 0 gives.'
  - '43.q4: Whether `concerns(event)` names the session: `howl watch` adds `session 6affad97`, the dashboard''s stream does not.'
  - '43.q5: How the parts of `concerns` are joined in `howl watch`: by two spaces today (`task 12  change 30`), by ` · ` in the dashboard.'
  - '43.q6: What the detail of a started session holds: the model and its source in `howl watch`, the model and the effort in the dashboard.'
  - '43.q7: What `detail` gives where the two copies differ beyond a started session: the reason of an ended session, a forced push, the branch of a review, and the data of other types.'
  - '43.q8: Whether the dashboard''s `concerns(item)` goes, so that the test "the line of the stream and the decoded view name the receiver of a giving" in `test/who-acted-read.test.ts` changes, or stays as a call of `concerns(event)`.'
  - '43.q9: Whether the test that reads the sources covers three places outside the files the issue names that write a span themselves: `src/read/writing-text.ts`, `src/howl/trace-read.ts` and `src/observe/github.ts`.'
  - '43.q10: The issue says "the text names the parts" in `test/show.test.ts` changes, but it compares no duration; the two tests that do are in `test/who-acted-read.test.ts`.'
