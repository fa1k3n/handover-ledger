issue: '43'
from: 0985acf064795c8a29ccfff38443fdaa9f2484c816a9b6c9ba4f0e223b190c9f
requirements:
  - id: '43.1'
    text: 'A new `src/read/words.ts`, with no Node, holds `duration(ms)`, `concerns(event)` and `detail(event)`.'
    source: 'What to build, point 1'
  - id: '43.2'
    text: '`duration(ms)` writes one form of a duration. Below a minute, whole seconds (`12 s`). From a minute, whole minutes, rounded down (`50 min`; `1 min` for 1 min 50 s), and no seconds. From an hour, hours and minutes, the minutes in two digits (`5 h 40 min`, `1 h 05 min`), up to `47 h 59 min`. From 48 hours, days with one decimal, as the overview does now (`2.0 d`, `2.5 d`). A span below 0 is `0 s`.'
    source: 'What to build, point 3; Tests first, point 1; answers 43.q1 (1), 43.q2 (1) and 43.q3 (1)'
  - id: '43.3'
    text: '`concerns(event)` says what an event concerns, its parts joined by ` · `: `task 12 · change 30`, and who a task was given to or taken from (`task 40 · to agent-1`, `task 40 · taken from agent-1`). It does not name the session.'
    source: 'Why, point 2; What to build, point 1; Tests first, point 1; answers 43.q4 (1) and 43.q5 (1)'
  - id: '43.4'
    text: '`detail(event)` gives the short detail of an event, one way for the terminal and the dashboard, and holds everything either copy shows today: a tool call its tool, target and outcome; a wait its kind of notification; a started session its model, its effort and where it came from (`startup`, `resume`); an ended session its reason; a change its branch, its commit, and `forced` on a forced push; checks their commit and the names that failed; a review its branch and its commit; any other type the fields of its data, as `key=value`, without `seen`. Its parts are joined by a space (`aaaaaaa lint, unit`), but those of a started session by ` · ` (`claude-opus-5-5 · high · startup`).'
    source: 'Why, point 3; What to build, point 1; Tests first, point 1; answers 43.q6 (3), 43.q7 (1) and 43.q12 (1)'
  - id: '43.5'
    text: '`since` goes from `state.ts`. `howl status` and the dashboard''s team work out how long ago an agent''s last event was and write that span with `duration`; an event stamped a moment ahead of the clock reads as `0 s`. `App.tsx` no longer imports `since`.'
    source: 'What to build, point 2; Files; answer 43.q3 (1)'
  - id: '43.6'
    text: '`state.ts` says what a row works on with `concerns`; its own copy (`worksOn`) goes, in `howl status` and in the dashboard''s team.'
    source: 'What to build, point 2; Files'
    guard: 'test/status.test.ts: #11: howl status prints one line per agent with its state and what it works on'
  - id: '43.7'
    text: '`overview.ts` loses its own `duration`; the overview''s lead time is written with `duration` of `words.ts`.'
    source: 'What to build, point 2; Files'
  - id: '43.8'
    text: '`show.ts` loses its own `duration` and `seconds`; `howl show` writes every span in the one form (`1 min`, `1 h 05 min`), not as `1m` or `1h 5m`.'
    source: 'What to build, points 2 and 3; Files; Existing tests this changes, point 1'
  - id: '43.9'
    text: '`watch.ts` loses `short` and the concerns built inside `formatLine`. `howl watch` writes what an event concerns with `concerns`, so its parts are joined by ` · ` (`task 12 · change 30`), and its short detail with `detail`. It adds the session after what the event concerns, on its own, as a part of its line (`session 6affad97`). A line still has the time, claimed or observed, the actor, the type, what it concerns, and the short of its data.'
    source: 'Why, points 2 and 3; What to build, point 2; Files; answers 43.q4 (1) and 43.q5 (1)'
    guard: 'test/watch.test.ts: howl watch prints one line per event with time, actor, type and what it concerns'
  - id: '43.10'
    text: 'The dashboard''s stream uses `concerns` and `detail` of `words.ts`, called with the row''s event; `concerns(item)` and `detail(item)` in `src/dashboard/format.ts` go, and `App.tsx` imports from `words.ts`.'
    source: 'What to build, point 2; Files; answer 43.q8 (1)'
  - id: '43.11'
    text: 'The dashboard writes every duration with `duration` of `words.ts`: `sessionText`, the lead time in `App.tsx`, and the summary and waits in `ChangeView.tsx`. `format.ts`, `App.tsx` and `ChangeView.tsx` import it from `words.ts`, not from `overview.ts`.'
    source: 'What to build, point 2; Files'
    guard: 'test/change-view.test.ts: #22: a head line and a session line for the view'
  - id: '43.12'
    text: 'A started session has the same detail in `howl watch` and in the dashboard''s stream.'
    source: 'Why, point 3; Tests first, point 2'
  - id: '43.13'
    text: 'No other function under `src/` formats a duration from milliseconds or seconds; a test reads the sources and shows it. Two places are left out, and the test names them with the reason: the time limit of reading the tests of a head in `src/howl/trace-read.ts` (`took more than 10 s`) and the pause at GitHub''s limit in `src/observe/github.ts` (`waiting 30 s`), which are warnings in code that records events, and this step does not class the change.'
    source: 'Tests first, point 3; answer 43.q9 (2)'
  - id: '43.14'
    text: 'README.md: the example output of `howl show` takes the one form of a duration, and the example of `howl watch` joins what an event concerns by ` · `. The README holds no example output of `howl status` today.'
    source: 'Files; answer 43.q5 (1)'
  - id: '43.15'
    text: 'Times of day and time zones are not changed: they already have one place each. The review reads for this; the guard shows the times as they are.'
    source: 'Not in this step'
    guard: 'test/dashboard-format.test.ts: #12: times are shown in the time zone given, and in UTC on the decoded event'
  - id: '43.16'
    text: 'The pull request lists each changed line of a test. No test can show this; the review reads the pull request for it.'
    source: 'Existing tests this changes, last line'
  - id: '43.17'
    text: 'The line that says how long events have waited for the writer, in `src/read/writing-text.ts` (`for 7 min`), writes its span with `duration`.'
    source: 'answer 43.q9 (2)'
    guard: 'test/waiting.test.ts: #102: the line names the project and the number, and is said only when events wait'
interface: |
  // src/read/words.ts: new; no Node. It may use `checksNames` of src/read/checks-text.ts, which has no Node.
  export function duration(ms: number): string
  export function concerns(event: LedgerEvent): string
  export function detail(event: LedgerEvent): string

  // src/read/watch.ts: keeps its signature; `short` goes.
  export function formatLine(event: LedgerEvent, colour: boolean, utc?: boolean): string

  // src/read/state.ts: `since` and `worksOn` go. These stay.
  export function agentStates(events: LedgerEvent[], now: number, options?: StateOptions): AgentRow[]
  export function renderStatus(rows: AgentRow[], now: number): string
    // AgentRow.task?: string; AgentRow.change?: string; AgentRow.last: string (the time of the last event)

  // src/read/overview.ts: `duration` goes. These stay.
  export function keyFigures(events: LedgerEvent[], now: number): KeyFigures
    // KeyFigures.leadTimeMedianMs: number | null

  // src/read/show.ts: its private `duration` and `seconds` go. These stay.
  export function show(all: LedgerEvent[], asked: Asked, activityFrom: string | null, options?: { matched?: boolean }): Shown | null
  export function parseAsked(text: string): Asked
  export function render(shown: Shown, options?: { utc?: boolean }): string

  // src/read/writing-text.ts: stays; its span is written with `duration`.
  export function writingLine(project: string, w: Writing, now: number): string | null

  // src/dashboard/format.ts: `concerns(item: Item)` and `detail(item: Item)` go; this stays and uses `duration`.
  export function sessionText(s: Session): string   // `agent-1 · fix · 33 min · Bash 54, Read 1`
  export function decodedFields(item: Item): Field[]

  // Types the tests use: LedgerEvent from src/ledger/schema.ts; Session from src/read/show.ts.
