questions:
  - '175.q1: The issue gives `task_from: env | branch` only "for example": which name and values does the event use?'
  - '175.q2: How is an event ranked that holds a task but does not say where it came from (every event written before this change, including those since #41)?'
  - '175.q3: When is the change on the branch shown: only when the task came from the branch, also when the session has no task, also when HOWL_TASK names the task the host links to that change?'
  - '175.q4: May the change alter the existing test "R41.4: a task written on the agent''s events keeps the change opened on its branch (finding 1, round 1)" in test/state.test.ts, whose events hold a task with no source? The issue names no existing test it changes.'
  - '175.q5: Which readers rank the task by its source: the state only (howl status, the dashboard''s agents), or also howl show and the overview?'
  - '175.q6: Do the observer''s events also say where their task came from (the host''s link, or the branch)?'
  - '175.q7: May an event say where its task came from without holding a task, or does the schema refuse that?'
