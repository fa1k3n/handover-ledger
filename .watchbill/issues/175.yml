issue: '175'
from: 77125198970e3b716d674b6a2d57032393fe3134ef35d2749baf46472e6887b6
requirements:
  - id: '175.1'
    text: 'An event the hook writes that holds a task records where its task came from in the field `task_from`: `env` when the task came from HOWL_TASK, `branch` when it came from the branch by task_from_branch. An event with no task has no `task_from`.'
    source: 'Issue body: "The event needs to record where its task came from (for example `task_from: env | branch`)"; answer 175.q1 (choice 1, as suggested).'
  - id: '175.2'
    text: 'The event schema holds `task_from` with the values `env` and `branch`, and the TypeScript types are generated from it; an event with another value is refused and nothing is written.'
    source: 'Issue body: "The event needs to record where its task came from"; answer 175.q1; CLAUDE.md: the event schema in schema/ is the source, an event the schema does not accept is refused.'
  - id: '175.3'
    text: 'The schema refuses an event that holds `task_from` and no `task`, and nothing is written.'
    source: 'Answer 175.q7 (choice 1, as suggested).'
  - id: '175.4'
    text: 'A hook sent to /api/hook gives the same `task_from` as howl hook gives for the same hook.'
    source: 'Issue body: "the hook writes the task from the branch onto the event"; the hook line and howl hook build one event (#67).'
    guard: 'each of the five hooks sent to /api/hook gives the event howl hook gives, but for id, time and the adapter'
  - id: '175.5'
    text: 'The state (howl status and the dashboard''s agents) ranks a session''s task by where it came from, in the owner''s order: HOWL_TASK, then the task the code host links to the change on the session''s branch, then the branch''s. No other reader (howl show, the overview) ranks it.'
    source: 'Issue body: "The owner''s order is `HOWL_TASK`, then the task the code host links to the change, then the branch''s." and "so readers can rank them"; answer 175.q5 (choice 1, as suggested).'
  - id: '175.6'
    text: 'An event that holds a task and no `task_from` (every event written before this change) is read as if its task were named by the session (`env`).'
    source: 'Answer 175.q2 (choice 1, as suggested).'
  - id: '175.7'
    text: 'The change opened on the session''s branch is shown when the session''s task came from the branch.'
    source: 'First comment (from #174, review round 2, note 8): "the change from the branch can be shown only when the task came from the branch"; answer 175.q3 (choice 2, as suggested).'
  - id: '175.8'
    text: 'The change opened on the session''s branch, and the task the code host links to it, are shown when the session has no task.'
    source: 'Answer 175.q3 (choice 2, as suggested): "or the session has no task".'
    guard: '#11: an event that names change gives the row its change, over the branch'
  - id: '175.9'
    text: 'The change opened on the session''s branch is shown when the session''s HOWL_TASK names the task the code host links to that change.'
    source: 'Answer 175.q3 (choice 2, as suggested): "also when `HOWL_TASK` names the task the code host links to that change".'
  - id: '175.10'
    text: 'In every other case the change opened on the session''s branch is not shown: a session whose HOWL_TASK names a task (or whose task has no `task_from`) is not shown a change the code host links to another task or to none.'
    source: 'First comment: "a session that names its task with `HOWL_TASK` is also shown the change on its branch, even when that change is linked to another task", and "can be shown only when"; answer 175.q3 (choice 2, as suggested).'
  - id: '175.11'
    text: 'Only the hook''s events say where their task came from: the observer''s events carry no `task_from`.'
    source: 'Answer 175.q6 (choice 1, as suggested).'
interface: |
  The event field, in schema/event.v0.schema.json and the generated src/ledger/event.gen.ts:
    LedgerEvent.task_from?: "env" | "branch"

  src/hook/hook.ts:
    eventOfHook(hook: Record<string, unknown>, env: Record<string, string | undefined>, dir: string, adapter: string)
      : { project: Project; event: LedgerEvent } | null
    runHook(stdin: string, env: Record<string, string | undefined>, cwd: string): Promise<void>

  src/read/state.ts:
    agentStates(events: LedgerEvent[], now: number, options?: StateOptions): AgentRow[]
    renderStatus(rows: AgentRow[], now: number): string
    interface StateOptions { agents?: ReadonlySet<string> }
    interface AgentRow { agent: string; state: AgentState; task?: string; change?: string; branch?: string; session?: string; gaps: string[]; ... }

  src/ledger/schema.ts:
    eventFaults(value: unknown): string[]

  src/ledger/ledger.ts:
    openLedger(path, { project }) -> writer with append(event) and close(); type LedgerEvent

  As a process: `howl hook` reads the hook's JSON on standard input, takes HOWL_ACTOR, HOWL_TASK, HOWL_CHANGE and HOWL_HOME
  from the environment, prints nothing, ends with 0, and leaves one event in the inbox. `howl status` prints the rows.
  `howl observe` writes the observer's events. The server's POST /api/hook takes the same JSON, with HOWL_TASK as the
  header X-Howl-Task.

  Test helpers, as they are: test/helpers.ts (event, folder, git, howl, inboxEvents, PROJECT, workspace, type Workspace),
  test/local-host.ts (LocalHost, at, SHA), test/up-helpers.ts (up, until, send, claim, type Up).
